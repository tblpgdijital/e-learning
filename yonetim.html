<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#002b49">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TBPG Eğitim">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./icon-192.png">
  <title>TUI BLUE Palm Garden - Yönetim Merkezi</title>
  <meta name="tbpg-build" content="20260917-v11.1-speed">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script src="./config.js?v=shared-onesignal-20260913-3"></script>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06182c;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    #appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
    #boot{position:fixed;inset:0;z-index:99998;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px),radial-gradient(circle at 76% 17%,rgba(76,134,235,.23),transparent 34%),linear-gradient(145deg,#06172a,#0a2b50 58%,#123967);background-size:30px 30px,30px 30px,auto,auto;color:#fff;transition:opacity .35s ease}
    #boot:before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;left:-250px;bottom:-290px;background:rgba(62,126,232,.13);filter:blur(8px);animation:mgGlow 4s ease-in-out infinite alternate}
    #boot.hide{opacity:0;pointer-events:none}.bootBox{position:relative;width:min(410px,90vw);text-align:center;padding:32px 26px 28px;border-radius:27px;background:linear-gradient(145deg,rgba(9,36,66,.87),rgba(9,27,50,.94));border:1px solid rgba(143,188,255,.14);box-shadow:0 30px 82px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden;animation:mgCard .5s cubic-bezier(.22,1,.36,1) both}.bootBox:after{content:"";position:absolute;inset:-50%;background:conic-gradient(from 90deg,transparent 0 40%,rgba(91,151,247,.07) 48%,transparent 56%);animation:mgScan 5s linear infinite;pointer-events:none}
    .bootIcon{position:relative;width:82px;height:82px;border-radius:23px;margin:0 auto 17px;display:grid;place-items:center;background:linear-gradient(145deg,#4b8ef4,#183d79);box-shadow:0 17px 38px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.18);animation:mgFloat 1.9s ease-in-out infinite;z-index:1}.bootIcon svg{width:38px;height:38px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .bootKicker{position:relative;z-index:1;font-size:9px;letter-spacing:2px;font-weight:800;color:#7facf0;margin-bottom:6px}.bootTitle{position:relative;z-index:1;font-weight:850;font-size:21px;letter-spacing:.2px}.bootSub{position:relative;z-index:1;color:#9eb4cb;font-size:12px;margin-top:7px}.bootLine{position:relative;z-index:1;width:210px;height:6px;background:rgba(255,255,255,.08);border-radius:20px;overflow:hidden;margin:20px auto 0}.bootLine:after{content:"";display:block;width:38%;height:100%;background:linear-gradient(90deg,#3d7ddd,#83baff,#4d89e7);border-radius:inherit;animation:move 1.2s ease-in-out infinite}
    @keyframes move{from{transform:translateX(-115%)}to{transform:translateX(295%)}}@keyframes mgFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes mgCard{from{opacity:0;transform:translateY(13px) scale(.97)}to{opacity:1;transform:none}}@keyframes mgGlow{from{transform:translate3d(0,0,0)}to{transform:translate3d(60px,-24px,0) scale(1.08)}}@keyframes mgScan{to{transform:rotate(360deg)}}
    #pushBtn{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:99999;border:0;border-radius:999px;padding:12px 16px;background:#0b2b4e;color:#fff;font-weight:800;box-shadow:0 10px 28px rgba(0,0,0,.28);display:none;cursor:pointer}
    #installTip{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:100000;background:#fff;color:#17384c;border:1px solid #cfe0ea;border-radius:16px;padding:13px 42px 13px 14px;box-shadow:0 12px 34px rgba(0,59,106,.16);font-size:13px;line-height:1.45;display:none}#installTip b{color:#002b49}#tipClose{position:absolute;right:8px;top:7px;width:30px;height:30px;border:0;border-radius:10px;background:#eef4f8;color:#31596e;font-size:19px}
    #status{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:100001;background:rgba(6,24,44,.96);color:#fff;padding:8px 12px;border-radius:999px;font-size:11px;font-weight:700;display:none;max-width:calc(100% - 24px);text-align:center}
  </style>
</head>
<body>
  <div id="boot"><div class="bootBox"><div class="bootIcon" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M8 38V25"/><path d="M20 38V16"/><path d="M32 38V9"/><path d="M5 38h38"/><path d="m7 19 11-7 10 3 12-9"/></svg></div><div class="bootKicker">TUI BLUE PALM GARDEN</div><div class="bootTitle">YÖNETİM MERKEZİ</div><div class="bootSub">Ekip verileri, raporlar ve yönetim araçları hazırlanıyor...</div><div class="bootLine"></div></div></div>
  <iframe id="appFrame" title="TUI BLUE Palm Garden Yönetim Merkezi" allow="clipboard-read; clipboard-write; camera; microphone; fullscreen; autoplay" allowfullscreen></iframe>
  <button id="pushBtn" type="button">🔔 Bildirimleri Aç</button>
  <div id="installTip"><button id="tipClose" type="button">×</button><b>iPhone:</b> Bildirim alabilmek için önce bu sayfayı <b>Ana Ekrana Ekle</b>. Sonra ana ekrandaki <b>TBPG Eğitim</b> ikonundan açıp <b>“Bildirimleri Aç”</b> butonuna dokunun.</div>
  <div id="status"></div>
<script>
(() => {
  'use strict';
  const cfg = window.TBPG_EDUCATION_CONFIG || {};
  const frame = document.getElementById('appFrame');
  const boot = document.getElementById('boot');
  const pushBtn = document.getElementById('pushBtn');
  const installTip = document.getElementById('installTip');
  let currentEducationId = '';
  let oneSignalApi = null;
  let pendingEducationUser = null;
  let currentPortalMode = 'yonetim';

  function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
  function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
  function showStatus(text,ms=2600){const e=document.getElementById('status');e.textContent=text;e.style.display='block';clearTimeout(showStatus.timer);showStatus.timer=setTimeout(()=>e.style.display='none',ms)}
  function maybeShowIOSInstallTip(){if(isIOS()&&!isStandalone()&&localStorage.getItem('egitim_install_tip_closed')!=='1')installTip.style.display='block'}
  document.getElementById('tipClose').addEventListener('click',()=>{installTip.style.display='none';localStorage.setItem('egitim_install_tip_closed','1')});

  function portalUrl(mode){
    try{
      const u=new URL(cfg.APP_URL,window.location.href);
      u.searchParams.set('portal',mode==='yonetim'?'yonetim':'personel');
      u.searchParams.set('embedded','1');
      return u.toString();
    }catch(_){
      const sep=String(cfg.APP_URL||'').includes('?')?'&':'?';
      return String(cfg.APP_URL||'')+sep+'portal='+(mode==='yonetim'?'yonetim':'personel')+'&embedded=1';
    }
  }

  function loadPortal(mode){
    currentPortalMode = mode==='yonetim' ? 'yonetim' : 'personel';
    bootHazirla();
    frame.src = portalUrl(currentPortalMode);
  }

  function isGooglePortalOrigin(origin){
    try{
      const u=new URL(origin);
      const h=String(u.hostname||'').toLowerCase();
      return u.protocol==='https:' && (h==='script.google.com' || h==='script.googleusercontent.com' || h.endsWith('.googleusercontent.com'));
    }catch(_){ return false; }
  }

  let bootFallbackTimer=null;
  function bootHazirla(){
    boot.classList.remove('hide');
    clearTimeout(bootFallbackTimer);
    bootFallbackTimer=setTimeout(()=>{
      boot.classList.add('hide');
      showStatus('Yönetim verileri beklenenden uzun sürüyor. Ekran arka planda güncellenmeye devam ediyor.',5200);
    },45000);
  }
  function bootKapat(){
    clearTimeout(bootFallbackTimer);
    boot.classList.add('hide');
  }

  // iframe'in yalnız HTML olarak yüklenmesi artık "hazır" sayılmaz.
  // Asıl Apps Script dashboard'u veriyi ekrana bastığında TBPG_YONETIM_READY yollar.
  frame.addEventListener('load',()=>console.info('[TBPG] Yönetim iframe yüklendi; dashboard verisi bekleniyor...'));
  loadPortal('yonetim');

  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js?v=20260917-v111-speed',{scope:'/e-learning/'}).catch(err=>console.warn('PWA worker:',err)));
  }

  function refreshPushButton(){
    const supported=('Notification' in window)&&('serviceWorker' in navigator);
    if(!supported){pushBtn.style.display='none';return}
    if(isIOS()&&!isStandalone()){pushBtn.style.display='none';maybeShowIOSInstallTip();return}

    if(Notification.permission==='granted'){
      pushBtn.style.display='none';
      return;
    }

    pushBtn.style.display='block';
    pushBtn.textContent = Notification.permission==='denied'
      ? '🔕 Bildirim İzni Kapalı'
      : '🔔 Bildirimleri Aç';
  }

  async function setEducationTags(payload){
    if(!oneSignalApi) return;
    await oneSignalApi.User.addTags({
      portal_egitim:'1',
      egitim_departman:String(payload.department||''),
      egitim_rol:String(payload.role||'')
    });
  }

  async function bindOneSignalUser(payload){
    if(!payload||!payload.educationId)return;
    pendingEducationUser=payload;
    currentEducationId=String(payload.educationId).trim();
    if(!currentEducationId)return;
    if(!oneSignalApi){ refreshPushButton(); return; }
    try{
      await oneSignalApi.login(currentEducationId);
      await setEducationTags(payload);
      refreshPushButton();
    }catch(err){console.error('OneSignal user bind:',err)}
  }

  window.OneSignalDeferred=window.OneSignalDeferred||[];
  window.OneSignalDeferred.push(async function(OneSignal){
    oneSignalApi=OneSignal;
    try{
      await OneSignal.init({
        appId:cfg.ONESIGNAL_APP_ID,
        serviceWorkerPath:cfg.ONESIGNAL_WORKER_PATH,
        serviceWorkerParam:{scope:cfg.ONESIGNAL_WORKER_SCOPE},
        autoResubscribe:true
      });
      if(pendingEducationUser) await bindOneSignalUser(pendingEducationUser);
      refreshPushButton();
    }catch(err){console.error('OneSignal init:',err);showStatus('Bildirim sistemi ayarı kontrol edilmeli',4200)}
  });

  pushBtn.addEventListener('click',async()=>{
    try{
      if(isIOS()&&!isStandalone()){
        maybeShowIOSInstallTip();
        showStatus('Önce Ana Ekrana ekleyin');
        return;
      }

      if(!oneSignalApi){
        showStatus('Bildirim sistemi hazırlanıyor');
        return;
      }

      if(Notification.permission==='denied'){
        showStatus('Bildirim izni tarayıcıda engelli. Adres çubuğu > Site ayarları > Bildirimler > İzin ver.',6500);
        return;
      }

      if(currentEducationId){
        await oneSignalApi.login(currentEducationId);
      }

      await oneSignalApi.Notifications.requestPermission();

      if(Notification.permission==='granted'){
        try{
          if(oneSignalApi.User && oneSignalApi.User.PushSubscription){
            await oneSignalApi.User.PushSubscription.optIn();
          }
        }catch(_){}

        if(currentEducationId){
          await oneSignalApi.User.addTag('portal_egitim','1');
        }

        pushBtn.style.display='none';
        showStatus('Eğitim bildirimleri açıldı ✓',3500);
      }else{
        refreshPushButton();
        showStatus('Bildirim izni verilmedi',3000);
      }
    }catch(err){
      console.error('Permission:',err);
      refreshPushButton();
      showStatus('Bildirim izni açılamadı',3500);
    }
  });

  window.addEventListener('message',async(event)=>{
    const data=event.data||{};

    // V11.1: Yönetim kabuğu, iframe load olayında değil gerçek dashboard verisi hazır
    // olduğunda açılır. Apps Script HtmlService mesajı bir alt sandbox'tan gelebilir.
    if(data.type==='TBPG_YONETIM_LOADING' && data.portal==='EGITIM'){
      if(event.origin && !isGooglePortalOrigin(event.origin)) return;
      if(!boot.classList.contains('hide')) bootHazirla();
      return;
    }
    if(data.type==='TBPG_YONETIM_READY' && data.portal==='EGITIM'){
      if(event.origin && !isGooglePortalOrigin(event.origin)) return;
      console.info('[TBPG] Yönetim dashboard hazır:',data.source||'server');
      bootKapat();
      return;
    }
    if(data.type==='TBPG_YONETIM_ERROR' && data.portal==='EGITIM'){
      if(event.origin && !isGooglePortalOrigin(event.origin)) return;
      bootKapat();
      showStatus('Yönetim verisi alınamadı: '+String(data.message||'Bilinmeyen hata'),6500);
      return;
    }

    // Apps Script HtmlService içindeki gerçek uygulama, GitHub frame'inin bir alt
    // sandbox penceresinden mesaj gönderebilir. Portal geçişi için kaynak Google
    // Apps Script/googleusercontent olmak zorunda; hedef URL ise her zaman sabit
    // cfg.APP_URL üzerinden tarafımızdan oluşturulur.
    if(data.type==='TBPG_EDUCATION_PORTAL_SWITCH'){
      // Hedef kullanıcı girdisinden URL almıyor; yalnızca iki sabit portal modu arasında
      // geçiş yapılıyor. Apps Script sandbox'ının event.origin değeri tarayıcıya göre değişebildiği için
      // burada hedef URL kullanıcıdan alınmaz. Yalnız aynı /e-learning/ klasöründeki iki
      // sabit GitHub sayfası arasında geçiş yapılır.
      if(data.portal!=='EGITIM') return;
      const mode=String(data.mode||'').toUpperCase()==='YONETIM'?'yonetim':'personel';
      console.info('[TBPG] Portal switch:',mode,'origin:',event.origin||'(empty)');
      showStatus(mode==='yonetim'?'Yönetici portalı açılıyor...':'Personel portalı açılıyor...',1200);
      window.location.href = mode==='yonetim' ? './yonetim.html' : './';
      return;
    }

    // Mevcut OneSignal / oturum entegrasyon mantığı korunur.
    if(!frame||event.source!==frame.contentWindow)return;
    if(data.type==='TBPG_EDUCATION_USER'){
      await bindOneSignalUser(data);
    }else if(data.type==='TBPG_EDUCATION_LOGOUT'){
      currentEducationId='';
      pendingEducationUser=null;
      pushBtn.style.display='none';
    }
  });

  maybeShowIOSInstallTip();
})();
</script>
</body>
</html>
