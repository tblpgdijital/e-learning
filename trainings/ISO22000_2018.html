<style>

.courseSceneNo{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.11);font-size:12px;font-weight:950}.courseSceneItem.done .courseSceneNo{background:#14b28a;color:#fff}
.courseSceneIcon{font-size:17px;text-align:center;color:#d7eef7}.courseSceneName{font-size:12px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.courseSceneState{font-size:13px;font-weight:950;color:#7ce3d8}
.sideFoot{margin-top:auto;padding:14px 20px;border-top:1px solid rgba(255,255,255,.10);font-size:10px;color:#a7c1cf;display:flex;justify-content:space-between;align-items:center}
.sideLeaf{width:26px;height:26px;border-radius:50% 50% 50% 6px;background:linear-gradient(145deg,#5fdc9f,#18a875);transform:rotate(-35deg);box-shadow:0 5px 14px rgba(0,0,0,.20)}

.top{grid-column:2;grid-row:1;background:rgba(255,255,255,.96);border-bottom:1px solid #dce9ef;display:grid;grid-template-columns:auto auto minmax(240px,1fr);align-items:center;gap:12px;padding:12px 22px;position:relative;z-index:20;box-shadow:0 6px 22px rgba(0,59,106,.05)}

.donut:after{content:"";width:34px;height:34px;background:#fff;border-radius:50%;position:absolute}.donutIcon{position:relative;z-index:2;color:#087bd7;font-weight:950;font-size:12px}
.completionText strong{display:block;color:#073b66;font-size:18px;line-height:1}.completionText span{display:block;color:#78909e;font-size:10px;font-weight:850;margin-top:4px;text-transform:uppercase}

.progressRailWrap{min-width:0;overflow:hidden;padding:2px 2px}.progressRail{display:flex;align-items:center;overflow-x:auto;padding:10px 6px 11px;scrollbar-width:none}.progressRail::-webkit-scrollbar{display:none}
.railUnit{display:flex;align-items:center;flex:0 0 auto}.railNode{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:3px solid #d6e7ef;background:#fff;color:#315772;font-size:11px;font-weight:950;box-shadow:0 4px 12px rgba(0,59,106,.08);transition:.35s;position:relative;cursor:pointer}
.railNode.done{background:#18ad78;border-color:#18ad78;color:#fff;box-shadow:0 0 0 4px rgba(24,173,120,.10)}.railNode.active{background:linear-gradient(145deg,#0cb8b1,#087bd7);border-color:#fff;color:#fff;transform:scale(1.12);box-shadow:0 0 0 4px rgba(8,123,215,.12),0 8px 22px rgba(8,123,215,.26);animation:nodePulse 1.8s ease-in-out infinite}
@keyframes nodePulse{50%{box-shadow:0 0 0 9px rgba(8,123,215,.08),0 10px 24px rgba(8,123,215,.26)}}
.railSeg{width:26px;height:6px;margin:0 2px;position:relative;overflow:hidden;border-radius:99px;background:repeating-linear-gradient(90deg,#c8ddea 0 7px,transparent 7px 11px)}
.railSeg:after{content:"";position:absolute;inset:0;transform:scaleX(0);transform-origin:left;background:repeating-linear-gradient(90deg,#18ad78 0 7px,transparent 7px 11px);transition:transform .55s ease}.railSeg.done:after{transform:scaleX(1)}
.railSeg.active:after{transform:scaleX(1);background:linear-gradient(90deg,#16b28b,#08a9c7,#087bd7,#08a9c7);background-size:220% 100%;animation:railFlow 1.15s linear infinite}@keyframes railFlow{to{background-position:-220% 0}}
.motto{position:absolute;right:24px;top:4px;font-size:9px;color:#178ab0;font-weight:850;pointer-events:none}

.stage{grid-column:2;grid-row:2;min-height:0;overflow-y:auto;overflow-x:hidden;padding:22px 32px 110px;background:radial-gradient(circle at 92% 5%,rgba(0,166,166,.11),transparent 25%),linear-gradient(145deg,#f8fcfe,#eef7fa);scroll-behavior:smooth}
.scene{width:min(1220px,calc(100% - 10px));min-height:0;margin:0 auto;padding:38px 44px 46px;border-radius:26px;background:rgba(255,255,255,.97);box-shadow:0 18px 52px rgba(0,59,106,.09);border:1px solid rgba(207,226,235,.78);position:relative;overflow:hidden}
.scene:before{content:"";position:absolute;right:-100px;top:-120px;width:330px;height:330px;border-radius:50%;background:linear-gradient(135deg,rgba(0,166,166,.10),rgba(0,139,210,.025));pointer-events:none}
.sceneQuote{position:absolute;right:34px;top:34px;max-width:250px;color:#496c85;font-size:14px;font-weight:700;text-align:right;line-height:1.35}.sceneQuote:before{content:"“";font-size:30px;color:#6c82c4;vertical-align:top;margin-right:5px}
.sceneMainTitle{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"no title" "no accent";column-gap:18px;row-gap:9px;align-items:center;margin:0 0 24px 0;position:relative;z-index:2}
.sceneTitleNo{grid-area:no;display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:linear-gradient(145deg,#08b8b0,#087bd7);color:#fff;font-size:28px;font-weight:950;box-shadow:0 11px 24px rgba(0,145,180,.22)}
.sceneTitleText{grid-area:title;min-width:0;font-size:clamp(22px,2.4vw,32px);font-weight:900;line-height:1.06;letter-spacing:-.02em;color:#063f6d}.sceneMainTitle:after{content:"";grid-area:accent;display:block;width:66px;height:4px;border-radius:999px;background:linear-gradient(90deg,#00a6a6,#087bd7);box-shadow:0 4px 12px rgba(0,150,180,.14)}
.block{position:relative;font-size:clamp(16px,1.35vw,20px);line-height:1.55;color:#213d4c;margin:16px 0}.info{padding:24px 26px;border-radius:18px;border:1px solid #b9def4;border-left:5px solid #00a6a6;background:linear-gradient(135deg,#effaff,#eaf7ff);box-shadow:0 7px 18px rgba(0,94,138,.05)}
.infoTheme-yellow{background:#fff8dd;border-left-color:#e4aa16}.infoTheme-red{background:#fff0f1;border-left-color:#d94b5d}.infoTheme-green{background:#edf9f3;border-left-color:#18a875}.infoTheme-blue{background:linear-gradient(135deg,#eef9ff,#e7f5ff);border-left-color:#1594d2}.infoTheme-teal{background:#e2faf7;border-left-color:#00a79d}.infoTheme-orange{background:#fff1dc;border-left-color:#f39a2d}.infoTheme-purple{background:linear-gradient(135deg,#f3ecff,#e9ddff);border-left-color:#8b62c8}.infoTheme-pink{background:#ffebf4;border-left-color:#d65c91}
.imageWrap{margin:20px auto}.imageWrap img{display:block;width:100%;max-height:520px;object-fit:contain;border-radius:18px}
.mediaFrame{width:100%;border-radius:18px;overflow:hidden;background:#071d2c;box-shadow:0 14px 34px rgba(0,35,55,.14)}.mediaFrame iframe{display:block;width:100%;height:min(56vw,610px);min-height:320px;border:0}.mediaFrame.video iframe{aspect-ratio:16/9;height:auto;min-height:0}.nativeVideo{width:100%;display:block;max-height:72vh}
.question{padding:24px;border-radius:20px;background:#f4f9fb;border:1px solid #d8e8ef}.question strong{display:block;font-size:22px;margin-bottom:14px}.question button{width:100%;padding:14px;margin:6px 0;border-radius:13px;border:1px solid #d3e3ea;background:#fff;text-align:left;font-size:16px;cursor:pointer}.question button.correct{background:#e9f9f2;border-color:#14a875}.question button.wrong{background:#fff1f3;border-color:#e24d65}.feedback{margin-top:10px;font-weight:800}.ok{color:#14845f}.no{color:#c63f56}
.revealBlock{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.revealCard{position:relative;overflow:hidden;min-height:145px;padding:20px;border-radius:20px;border:1px solid rgba(0,0,0,.06);box-shadow:0 10px 26px rgba(6,49,70,.09);cursor:pointer;transition:.22s}.revealCard:hover{transform:translateY(-4px)}.revealCard .answer{display:none;margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08)}.revealCard.open .answer{display:block}.revealIcon{display:grid;width:46px;height:46px;border-radius:14px;place-items:center;font-size:25px;background:rgba(255,255,255,.72);margin-bottom:11px}.hint,.tap{display:block;font-size:11px;color:#78909e;margin-top:6px}.revealCard.open .hint,.revealCard.open .tap{display:none}
.revealColor-blue{background:linear-gradient(145deg,#e9f6ff,#cfeeff);color:#07517a}.revealColor-teal{background:linear-gradient(145deg,#e3fbf8,#c3f2ec);color:#006d68}.revealColor-green{background:linear-gradient(145deg,#eaf9ef,#ccefd8);color:#14683a}.revealColor-orange{background:linear-gradient(145deg,#fff3df,#ffe0ad);color:#995000}.revealColor-purple{background:linear-gradient(145deg,#f3ecff,#dfd0ff);color:#65409b}.revealColor-pink{background:linear-gradient(145deg,#ffedf5,#ffd2e5);color:#9a3761}.revealColor-red{background:linear-gradient(145deg,#ffeded,#ffd0d0);color:#9b3333}.revealColor-yellow{background:linear-gradient(145deg,#fff9d9,#ffef9e);color:#796000}
.choiceWrap,.matchingWrap,.accordionWrap{padding:24px;border:1px solid #d8e8ef;border-radius:22px;background:linear-gradient(145deg,#fafdff,#f1f8fb)}
.interactionPrompt{display:block;margin-bottom:15px;color:#073b66;font-size:21px;font-weight:950}.choiceGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}
.choiceCard{position:relative;min-height:135px;padding:19px;border:2px solid #d8e6ec;border-radius:18px;background:#fff;text-align:left;cursor:pointer;transition:.18s;color:#173042}.choiceCard:hover{transform:translateY(-3px);border-color:#70bedf;box-shadow:0 11px 25px rgba(0,92,135,.12)}.choiceCard.selected{border-color:#087bd7;background:#eaf6ff}.choiceCard.correct{border-color:#18a875;background:#e8f9f1}.choiceCard.wrong{border-color:#dc4c64;background:#fff0f2}.choiceCardIcon{display:grid;width:42px;height:42px;place-items:center;border-radius:13px;background:#edf7fb;font-size:23px;margin-bottom:9px}.choiceCard strong,.choiceCard small{display:block}.choiceCard small{margin-top:6px;color:#708494;line-height:1.35}
.interactionActions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}.interactionBtn{border:0;border-radius:13px;padding:11px 17px;background:linear-gradient(135deg,#00a6a6,#087bd7);color:#fff;font-weight:900;cursor:pointer}.interactionBtn.secondary{background:#fff;color:#0870ad;border:1px solid #bcdce9}.interactionFeedback{font-weight:850}.interactionFeedback.ok{color:#14845f}.interactionFeedback.no{color:#c63f56}
.matchGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.matchCol{display:grid;gap:9px}.matchItem{padding:13px 14px;border:2px solid #d6e5ec;border-radius:14px;background:#fff;color:#173042;text-align:left;cursor:pointer;font-weight:750}.matchItem.active{border-color:#087bd7;background:#eaf6ff}.matchItem.matched{border-color:#18a875;background:#e8f9f1;color:#116d4f}.matchItem.wrong{animation:matchShake .32s;background:#fff0f2;border-color:#dc4c64}@keyframes matchShake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.accordionItem{margin:9px 0;border:1px solid #d6e5ec;border-radius:15px;background:#fff;overflow:hidden}.accordionHead{width:100%;padding:15px 17px;border:0;background:#fff;color:#073b66;text-align:left;font-weight:900;display:flex;gap:11px;align-items:center;cursor:pointer}.accordionHead:after{content:'＋';margin-left:auto}.accordionItem.open .accordionHead:after{content:'−'}.accordionBody{display:none;padding:0 17px 16px;line-height:1.5;color:#36566a}.accordionItem.open .accordionBody{display:block}.accordionItem.read{border-color:#18a875}.accordionItem.read .accordionHead:before{content:'✓';color:#18a875}

.videoWrap{margin:18px 0;border-radius:20px;overflow:hidden;background:#071d2c;box-shadow:0 14px 34px rgba(0,35,55,.16)}.videoFrame{position:relative;width:100%;aspect-ratio:16/9;background:#071d2c;overflow:hidden}.videoFrame>div,.videoFrame iframe,.videoFrame video{width:100%!important;height:100%!important;border:0!important;display:block;object-fit:contain}
.videoControls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:#071d2c;color:#fff}.videoControls button{border:0;border-radius:10px;padding:9px 12px;background:#123c50;color:#fff;font-weight:850;cursor:pointer}.videoStatus{margin-left:auto;font-size:12px;font-weight:850;color:#d9edf5}.videoStatus.done{color:#70e0b1}

.verticalNav{position:fixed;right:20px;bottom:18px;z-index:30;display:flex;flex-direction:column;gap:12px;align-items:center}.navGroup{display:block}.verticalNavBtn{width:58px;height:58px;border:0;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:950;cursor:pointer;box-shadow:0 12px 30px rgba(0,59,106,.20);transition:.2s}.verticalNavBtn.up{background:#fff;color:#087bd7}.verticalNavBtn.down{background:linear-gradient(145deg,#08b8b0,#087bd7);color:#fff}.verticalNavBtn:hover:not(:disabled){transform:translateY(-2px) scale(1.03)}.verticalNavBtn:disabled{opacity:.32;cursor:not-allowed;filter:grayscale(.25);box-shadow:none}.navLabel{display:none!important}
.taskToast{position:fixed;left:50%;top:108px;transform:translate(-50%,-12px);z-index:100;max-width:min(580px,calc(100vw - 28px));padding:13px 18px;border-radius:15px;background:rgba(7,59,92,.96);color:#fff;font-weight:850;font-size:13px;box-shadow:0 16px 42px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:.22s}.taskToast.show{opacity:1;transform:translate(-50%,0)}
.interactionAttention{animation:attentionPulse .75s ease 0s 3;outline:3px solid rgba(242,201,76,.75);outline-offset:5px}@keyframes attentionPulse{50%{transform:scale(1.018);box-shadow:0 0 0 8px rgba(242,201,76,.16)}}
.complete{min-height:470px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.completeIcon{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;font-size:46px;background:#00a6a6;color:#fff}.completeBtn{border:0;border-radius:15px;padding:15px 24px;background:#003b6a;color:#fff;font-weight:900;font-size:16px;cursor:pointer}
.mobileMenuBtn,.mobileSideBackdrop{display:none}

 .shell{grid-template-columns:0 minmax(0,1fr);grid-template-rows:88px minmax(0,1fr)}
 .courseSide{display:none}.courseSide.mobileOpen{display:flex;position:fixed;left:0;top:0;bottom:0;width:min(86vw,330px);z-index:90;box-shadow:18px 0 50px rgba(0,0,0,.28)}
 .mobileMenuBtn{display:grid;position:fixed;left:10px;top:14px;z-index:100;width:44px;height:44px;border:0;border-radius:13px;place-items:center;background:#073b5c;color:#fff;font-size:23px}

 .completionBox{height:48px;padding:3px 7px}.donut{width:38px;height:38px}.donut:after{width:28px;height:28px}.completionText strong{font-size:14px}.completionText span{display:none}
 .savePill{display:none}.progressRailWrap{grid-column:3}.railNode{width:29px;height:29px;font-size:10px}.railSeg{width:18px;height:5px}.motto{display:none}
 .stage{grid-column:2;padding:14px 9px 95px}.scene{width:100%;padding:26px 18px 38px;border-radius:20px}.sceneQuote{display:none}.sceneMainTitle{margin-right:0;column-gap:13px}.sceneTitleNo{width:58px;height:58px;font-size:28px}.sceneTitleText{font-size:clamp(28px,8vw,40px)}

function fitCourseSideTitle(){
  var el=document.getElementById("courseSideTitle");
  if(!el)return;
  var size=18,min=11;
  el.style.fontSize=size+"px";
  el.style.lineHeight="1.08";
  el.style.maxHeight="none";
  while(size>min){
    var line=parseFloat(getComputedStyle(el).lineHeight)||size*1.08;

    size-=0.5;
    el.style.fontSize=size+"px";

  el.style.maxHeight=(finalLine*2+2)+"px";
}

function openHotspot(pin,title,text){

 if(["warn","info","ok","no"].indexOf(type)<0)type="warn";
 var icon=pin.getAttribute("data-hot-icon")||({info:"ℹ",ok:"✓",no:"✕",warn:"⚠"}[type]||"⚠");

 var im=document.getElementById("hotspotImage"),iu=pin.getAttribute("data-hot-image")||"";
 if(iu){im.src=iu;im.hidden=false}else{im.hidden=true;im.removeAttribute("src")}

 pop.style.visibility="hidden";pop.style.left="8px";pop.style.top="8px";
 requestAnimationFrame(function(){
   var r=pin.getBoundingClientRect(),pr=pop.getBoundingClientRect(),gap=12,vw=window.innerWidth,vh=window.innerHeight;
   var left=r.left+r.width/2-pr.width/2;
   left=Math.max(8,Math.min(vw-pr.width-8,left));
   var belowTop=r.bottom+gap,aboveTop=r.top-pr.height-gap,useAbove=belowTop+pr.height>vh-8&&aboveTop>=8;
   var top=useAbove?aboveTop:Math.min(vh-pr.height-8,belowTop);
   pop.classList.toggle("above",useAbove);pop.classList.toggle("below",!useAbove);
   pop.style.left=Math.round(left)+"px";pop.style.top=Math.round(Math.max(8,top))+"px";
   var arrow=r.left+r.width/2-left-6;arrow=Math.max(16,Math.min(pr.width-28,arrow));
   pop.style.setProperty("--arrow-x",Math.round(arrow)+"px");
   pop.style.visibility="visible";
 });
}

function applyServerProgress(progress){
  try{
    progress=progress&&typeof progress==="object"?progress:{};
    var serverMax=Math.max(0,Math.floor(Number(progress.maxUnlocked)||0));
    var serverIndex=Math.max(0,Math.floor(Number(progress.index)||serverMax));
    if(state.pages&&state.pages.length){
      serverMax=Math.min(serverMax,state.pages.length-1);
      serverIndex=Math.min(serverIndex,state.pages.length-1);
    }
    maxUnlocked=Math.max(maxUnlocked,serverMax);
    index=Math.max(0,Math.min(maxUnlocked,Math.max(serverIndex,maxUnlocked)));

    var pv=progress.videos&&typeof progress.videos==="object"?progress.videos:{};
    Object.keys(pv).forEach(function(k){
      var s=pv[k]||{},l=videoGate[k]||{};
      var required=Math.max(Number(l.required)||0,Number(s.required)||0);
      var watched=Math.max(Number(l.watched)||0,Number(s.watched)||0);
      if(required>0)watched=Math.min(required,watched);
      videoGate[k]={required:required,watched:watched,done:!!l.done||!!s.done||(required>0&&watched>=required),playing:false,lastTick:0};
    });

    try{
      localStorage.setItem(PROGRESS_KEY,JSON.stringify({
        index:index,maxUnlocked:maxUnlocked,totalScenes:(state.pages||[]).length,
        percent:Math.max(0,Math.min(100,Number(progress.percent)||0)),
        videos:videoGate,updatedAt:Number(progress.updatedAt)||Date.now()
      }));
    }catch(eLocal){}

    render();
  }catch(e){}
}
window.addEventListener("message",function(event){
  var d=event&&event.data?event.data:null;
  if(!d)return;
  var gelen=String(d.egitimId||"").trim().toUpperCase();
  if(gelen&&gelen!==String(EGITIM_ID||"").trim().toUpperCase())return;

  if(d.type==="TBPG_TEK_HTML_ILERLEME_YUKLE"){
    applyServerProgress(d.progress||{});
    return;
  }
  if(d.type==="TBPG_TEK_HTML_ILERLEME_KAYDEDILDI"){
    var t=document.getElementById("saveText"),tm=document.getElementById("saveTime");
    if(t)t.textContent="İlerleme kaydedildi";
    var dt=new Date(Number(d.updatedAt)||Date.now());
    if(tm)tm.textContent=String(dt.getHours()).padStart(2,"0")+":"+String(dt.getMinutes()).padStart(2,"0");
    return;
  }
  if(d.type==="TBPG_TEK_HTML_ILERLEME_HATA"){
    var h=document.getElementById("saveText");
    if(h)h.textContent="Kayıt bekliyor";
  }
},false);
