.block{position:relative;font-size:clamp(16px,1.35vw,20px);line-height:1.55;color:#213d4c;margin:16px 0}.info{padding:24px 26px;border-radius:18px;border:1px solid #b9def4;border-left:5px solid #00a6a6;background:linear-gradient(135deg,#effaff,#eaf7ff);box-shadow:0 7px 18px rgba(0,94,138,.05)}
.infoTheme-yellow{background:#fff8dd;border-left-color:#e4aa16}.infoTheme-red{background:#fff0f1;border-left-color:#d94b5d}.infoTheme-green{background:#edf9f3;border-left-color:#18a875}.infoTheme-blue{background:linear-gradient(135deg,#eef9ff,#e7f5ff);border-left-color:#1594d2}.infoTheme-teal{background:#e2faf7;border-left-color:#00a79d}.infoTheme-orange{background:#fff1dc;border-left-color:#f39a2d}.infoTheme-purple{background:linear-gradient(135deg,#f3ecff,#e9ddff);border-left-color:#8b62c8}.infoTheme-pink{background:#ffebf4;border-left-color:#d65c91}
.imageWrap{margin:20px auto}.imageWrap img{display:block;width:100%;max-height:520px;object-fit:contain;border-radius:18px}
.mediaFrame{width:100%;border-radius:18px;overflow:hidden;background:#071d2c;box-shadow:0 14px 34px rgba(0,35,55,.14)}.mediaFrame iframe{display:block;width:100%;height:min(56vw,610px);min-height:320px;border:0}.mediaFrame.video iframe{aspect-ratio:16/9;height:auto;min-height:0}.nativeVideo{width:100%;display:block;max-height:72vh}
.question{padding:24px;border-radius:20px;background:#f4f9fb;border:1px solid #d8e8ef}.question strong{display:block;font-size:22px;margin-bottom:14px}.question button{width:100%;padding:14px;margin:6px 0;border-radius:13px;border:1px solid #d3e3ea;background:#fff;text-align:left;font-size:16px;cursor:pointer}.question button.correct{background:#e9f9f2;border-color:#14a875}.question button.wrong{background:#fff1f3;border-color:#e24d65}.feedback{margin-top:10px;font-weight:800}.ok{color:#14845f}.no{color:#c63f56}
.revealBlock{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.revealCard{position:relative;overflow:hidden;min-height:145px;padding:20px;border-radius:20px;border:1px solid rgba(0,0,0,.06);box-shadow:0 10px 26px rgba(6,49,70,.09);cursor:pointer;transition:.22s}.revealCard:hover{transform:translateY(-4px)}.revealCard .answer{display:none;margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08)}.revealCard.open .answer{display:block}.revealIcon{display:grid;width:46px;height:46px;border-radius:14px;place-items:center;font-size:25px;background:rgba(255,255,255,.72);margin-bottom:11px}.hint,.tap{display:block;font-size:11px;color:#78909e;margin-top:6px}.revealCard.open .hint,.revealCard.open .tap{display:none}

.videoWrap{margin:18px 0;border-radius:20px;overflow:hidden;background:#071d2c;box-shadow:0 14px 34px rgba(0,35,55,.16)}.videoFrame{position:relative;width:100%;aspect-ratio:16/9;background:#071d2c;overflow:hidden}.videoFrame>div,.videoFrame iframe,.videoFrame video{width:100%!important;height:100%!important;border:0!important;display:block;object-fit:contain}
.videoControls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:#071d2c;color:#fff}.videoControls button{border:0;border-radius:10px;padding:9px 12px;background:#123c50;color:#fff;font-weight:850;cursor:pointer}.videoStatus{margin-left:auto;font-size:12px;font-weight:850;color:#d9edf5}.videoStatus.done{color:#70e0b1}

function fitCourseSideTitle(){

function showToast(msg){var t=document.getElementById("taskToast");t.textContent=msg||"Lütfen tüm görevleri tamamlayın.";t.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(function(){t.classList.remove("show")},2600)}
function showTaskWarning(){var p=pg(),vb=(p.blocks||[]).find(function(b){return b.type==="video"&&durationSeconds(b.videoDuration)>0&&!(videoGate[String(b.id)]&&videoGate[String(b.id)].done)});if(vb){var g=videoGate[String(vb.id)],rem=g?Math.max(0,g.required-g.watched):durationSeconds(vb.videoDuration);showToast("Videoyu tamamlayınız · Kalan süre: "+fmt(rem));var w=document.querySelector('[data-video="'+CSS.escape(String(vb.id))+'"]');if(w)w.scrollIntoView({behavior:"smooth",block:"center"});return}showToast("Lütfen tüm görevleri tamamlayın.");var missing=null;(p.blocks||[]).some(function(b){if(b.type==="question"&&!qState[String(b.id)]){missing=document.querySelector('[data-q="'+CSS.escape(String(b.id))+'"]')?.closest(".question");return true}if(b.type==="reveal"&&!rState[String(b.id)]){missing=document.querySelector('[data-rid="'+CSS.escape(String(b.id))+'"]')?.closest(".revealBlock");return true}return false});if(missing){missing.classList.add("interactionAttention");missing.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(function(){missing.classList.remove("interactionAttention")},2600)}}
function gate(){var p=defs(pg()),rem=Math.max(0,Math.ceil((unlockAt-Date.now())/1000)),has=(p.blocks||[]).some(function(b){return b.type==="question"||b.type==="reveal"});var blocked=rem>0||(p.scene.requireInteraction&&has&&!doneInteraction())||!videoDone()||!reachedBottom;var st=document.getElementById("stage"),down=document.getElementById("pageDownBtn"),atBottom=st.scrollHeight<=st.clientHeight+8||st.scrollTop+st.clientHeight>=st.scrollHeight-8;down.disabled=blocked&&atBottom;return!blocked}
function bottom(){var s=document.getElementById("stage");reachedBottom=s.scrollHeight<=s.clientHeight+8||s.scrollTop+s.clientHeight>=s.scrollHeight-8;gate()}
function pageDown(){var st=document.getElementById("stage");if(!st)return;var atBottom=st.scrollHeight<=st.clientHeight+8||st.scrollTop+st.clientHeight>=st.scrollHeight-8;if(!atBottom){st.scrollBy({top:Math.max(300,st.clientHeight*.72),behavior:"smooth"});return}if(gate())go(1);else showTaskWarning()}
function pageUp(){var st=document.getElementById("stage");if(!st)return;if(st.scrollTop>8){st.scrollBy({top:-Math.max(300,st.clientHeight*.72),behavior:"smooth"});return}if(index>0)go(-1)}
function answer(btn,id,c,i){var q=btn.closest(".question");Array.from(q.querySelectorAll("button")).forEach(function(x){x.classList.remove("correct","wrong")});var ok=Number(c)===Number(i);btn.classList.add(ok?"correct":"wrong");qState[String(id)]=ok;var f=q.querySelector(".feedback");f.textContent=ok?"Doğru ✓":"Yanlış cevap, tekrar deneyiniz.";f.className="feedback "+(ok?"ok":"no");gate();saveProgress()}
function reveal(el){el.classList.toggle("open");var id=String(el.dataset.rid),ri=String(el.dataset.ri);rOpened[id]=rOpened[id]||{};rOpened[id][ri]=true;var cards=Array.from(document.querySelectorAll(".revealCard")).filter(function(c){return String(c.dataset.rid)===id});rState[id]=cards.length>0&&cards.every(function(c){return rOpened[id][String(c.dataset.ri)]===true});gate();saveProgress()}
function toggleMobileSide(force){var side=document.getElementById("courseSide"),back=document.getElementById("mobileSideBackdrop");var open=typeof force==="boolean"?force:!side.classList.contains("mobileOpen");side.classList.toggle("mobileOpen",open);back.classList.toggle("open",open)}
function render(){if(tick){clearInterval(tick);tick=null}var p=defs(pg());qState={};rState={};rOpened={};(p.blocks||[]).forEach(function(b){if(b.type==="question")qState[String(b.id)]=false;if(b.type==="reveal")rState[String(b.id)]=false});unlockAt=Date.now()+Math.max(0,Number(p.scene.minSeconds)||0)*1000;document.getElementById("scene").innerHTML='<h1 class="sceneMainTitle"><span class="sceneTitleNo">'+(index+1)+'</span><span class="sceneTitleText">'+esc(p.title||"Başlıksız Sahne")+'</span></h1>'+(p.blocks||[]).map(block).join("");bind();bindVideos(p);renderCourseSide();updateTop();var st=document.getElementById("stage");st.scrollTop=0;requestAnimationFrame(function(){st.scrollTop=0});reachedBottom=false;setTimeout(bottom,50);setTimeout(bottom,300);gate();saveProgress();tick=setInterval(gate,300)}
function go(d){if(d>0&&!gate()){showTaskWarning();return}var n=index+d;if(n<0)return;if(n>=state.pages.length){complete();return}if(d>0)maxUnlocked=Math.max(maxUnlocked,n);index=n;saveProgress();render()}
function complete(){maxUnlocked=Math.max(maxUnlocked,state.pages.length-1);saveProgress();document.getElementById("scene").innerHTML='<div class="complete"><div class="completeIcon">✓</div><h1>Eğitim Tamamlandı</h1><p>'+esc(state.title||"Eğitim")+' içeriğini tamamladınız.</p><button class="completeBtn" onclick="finish()">Sınava Geç →</button></div>';document.getElementById("percent").textContent="100%";document.getElementById("donut").style.setProperty("--p",100);renderRail()}
function finish(){try{window.parent.postMessage({type:"TBPG_TEK_HTML_TAMAMLANDI",egitimId:EGITIM_ID},"*")}catch(e){}}
function exitTraining(){saveProgress();try{window.parent.postMessage({type:"TBPG_TEK_HTML_CIKIS",egitimId:EGITIM_ID},"*")}catch(e){}if(window.parent===window&&history.length>1)history.back()}

document.getElementById("stage").addEventListener("scroll",bottom,{passive:true});
window.addEventListener("resize",bottom,{passive:true});
document.getElementById("pageUpBtn").onclick=pageUp;
document.getElementById("pageDownBtn").onclick=pageDown;
document.getElementById("exitBtn").onclick=exitTraining;
document.getElementById("mobileMenuBtn").onclick=function(){toggleMobileSide()};
document.getElementById("mobileSideBackdrop").onclick=function(){toggleMobileSide(false)};
loadProgress();
try{window.parent.postMessage({type:"TBPG_TEK_HTML_READY",egitimId:EGITIM_ID,internalExit:true},"*")}catch(e){}
if(!state.pages||!state.pages.length){document.getElementById("scene").innerHTML="<h1>İçerik bulunamadı</h1>"}else{render()}
</script>
</body>
